        /* ===== ANIMASI HOVER CEKLIST ===== */

.status-toggle {
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
}

/* Hover efek glow + naik */
.status-toggle:hover {
    transform: none;
    box-shadow: none;
    cursor: default;
}

/* Klik efek tekan */
.status-toggle:active {
    transform: none;
    box-shadow: none;
}

/* Ripple luxury effect */
.status-toggle::after {
    content: "";
    position: absolute;
    width: 0;
    height: 0;
    background: var(--accent-color);
    opacity: 0.25;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.4s ease, height 0.4s ease, opacity 0.4s ease;
}

/* Saat hover muncul cahaya */
.status-toggle:hover::after {
    width: 0;
    height: 0;
    opacity: 0.25;
}
