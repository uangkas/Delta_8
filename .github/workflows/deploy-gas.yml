name: Deploy Google Apps Script

on:
  push:
    branches:
      - main
    paths:
      - "Code.gs"
      - "index.html"
      - "gas_fix/**"
      - "scripts/sync-deploy-sources.ps1"
      - "scripts/invoke-gas-admin-endpoint.ps1"
      - ".github/workflows/deploy-gas.yml"
  pull_request:
    paths:
      - "Code.gs"
      - "index.html"
      - "gas_fix/**"
      - "scripts/sync-deploy-sources.ps1"
      - "scripts/invoke-gas-admin-endpoint.ps1"
      - ".github/workflows/deploy-gas.yml"
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GAS_WEBAPP_URL: https://script.google.com/macros/s/AKfycbzY63DzQTu_RP106fQoI2q0joumt_vJhhesMufpJN1iTZQtBoZRYWNs7wfb88xRp2PBsg/exec

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync root sources into deploy folders
        shell: pwsh
        run: ./scripts/sync-deploy-sources.ps1

      - name: Install clasp
        run: npm install --global @google/clasp@3.3.0

      - name: Write clasp credentials
        env:
          CLASP_CREDENTIALS_JSON_B64: ${{ secrets.CLASP_CREDENTIALS_JSON_B64 }}
        run: |
          if [ -z "$CLASP_CREDENTIALS_JSON_B64" ]; then
            echo "Secret CLASP_CREDENTIALS_JSON_B64 belum diisi."
            exit 1
          fi
          printf '%s' "$CLASP_CREDENTIALS_JSON_B64" | base64 --decode > "$HOME/.clasprc.json"

      - name: Write Apps Script config
        env:
          GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
        run: |
          if [ -z "$GAS_SCRIPT_ID" ]; then
            echo "Secret GAS_SCRIPT_ID belum diisi."
            exit 1
          fi
          cat > gas_fix/.clasp.json <<EOF
          {
            "scriptId": "$GAS_SCRIPT_ID",
            "rootDir": "."
          }
          EOF

      - name: Push source to Apps Script
        working-directory: gas_fix
        run: clasp push --force

      - name: Backup script properties
        shell: pwsh
        env:
          GAS_AUTH_TOKEN: ${{ secrets.GAS_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GAS_AUTH_TOKEN)) {
            Write-Host "Secret GAS_AUTH_TOKEN belum diisi. Skip backup properties."
            exit 0
          }
          ./scripts/invoke-gas-admin-endpoint.ps1 -Url $env:GAS_WEBAPP_URL -Action "backupProperties" -AuthToken $env:GAS_AUTH_TOKEN -AllowFailure

      - name: Create new version
        id: version
        working-directory: gas_fix
        run: |
          VERSION_OUTPUT="$(clasp version "GitHub Actions ${GITHUB_SHA}")"
          echo "$VERSION_OUTPUT"
          VERSION_NUMBER="$(printf '%s' "$VERSION_OUTPUT" | sed -n 's/.*Created version \([0-9][0-9]*\).*/\1/p')"
          if [ -z "$VERSION_NUMBER" ]; then
            echo "Gagal membaca version number dari output clasp."
            exit 1
          fi
          echo "number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Redeploy web app URL existing
        working-directory: gas_fix
        run: clasp deploy --deploymentId AKfycbzY63DzQTu_RP106fQoI2q0joumt_vJhhesMufpJN1iTZQtBoZRYWNs7wfb88xRp2PBsg --versionNumber ${{ steps.version.outputs.number }} --description "GitHub Actions ${GITHUB_SHA}"

      - name: Run backend self-test
        shell: pwsh
        env:
          GAS_AUTH_TOKEN: ${{ secrets.GAS_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GAS_AUTH_TOKEN)) {
            Write-Host "Secret GAS_AUTH_TOKEN belum diisi. Skip backend self-test."
            exit 0
          }
          ./scripts/invoke-gas-admin-endpoint.ps1 -Url $env:GAS_WEBAPP_URL -Action "adminSelfTest" -AuthToken $env:GAS_AUTH_TOKEN
