name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "firebase-messaging-sw.js"
      - "public/**"
      - "firebase.json"
      - ".firebaserc"
      - ".firebaseignore"
      - "scripts/sync-deploy-sources.ps1"
      - ".github/workflows/firebase-hosting-merge.yml"
      - ".github/workflows/firebase-hosting-pull-request.yml"
  pull_request:
    paths:
      - "index.html"
      - "firebase-messaging-sw.js"
      - "public/**"
      - "firebase.json"
      - ".firebaserc"
      - ".firebaseignore"
      - "scripts/sync-deploy-sources.ps1"
      - ".github/workflows/firebase-hosting-merge.yml"
      - ".github/workflows/firebase-hosting-pull-request.yml"

permissions:
  contents: read

concurrency:
  group: deploy-firebase-live
  cancel-in-progress: true

jobs:
  deploy_live_website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync root sources into hosting folder
        shell: pwsh
        run: ./scripts/sync-deploy-sources.ps1

      - uses: FirebaseExtended/action-hosting-deploy@v0.10.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: kas-delta-8
          channelId: live
